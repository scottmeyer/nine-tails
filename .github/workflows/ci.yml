name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  platforms:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        if: runner.os != 'Windows'
        run: go test -count=1 ./...

      - name: Test portable packages on Windows
        if: runner.os == 'Windows'
        run: >-
          go test -count=1
          ./internal/capsule
          ./internal/cli
          ./internal/compile
          ./internal/harness
          ./internal/starter
          ./internal/store
          ./internal/tokens

      - name: Test Windows harness launching
        if: runner.os == 'Windows'
        run: go test -count=1 -run '^TestWindowsHarnessCommand' ./cmd/nine-tails

      - name: Build
        run: go build ./cmd/nine-tails
