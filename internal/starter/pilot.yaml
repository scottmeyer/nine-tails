nine_tails_export: 1
agent: pilot
records:
  - lane: definition
    kind: agent-base
    name: base
    meta:
      title: [nine-tails Pilot]
    body: |-
      ## Purpose

      nine-tails is durable memory across sessions, repositories, and execution
      environments: named agents whose instructions, learned preferences,
      relevant experience, state, tools, and signals arrive in a capsule. This
      pilot is the usage guide and agent catalog. It is an ordinary agent, so
      correct it through its own paired receipt like any other.

      Use pilot for discovery when no role is selected. A direct named load,
      `nine-tails load --agent <name> --task "<concise non-sensitive purpose>"`,
      already carries the common learning protocol; no guide load is required.

      ## The loop

      1. On the first load in a session, pass `--meta repo-id=<repo>` from the
         repository instruction file and `--meta harness=<harness>` whenever
         the harness is known. Use `harness=unknown` only when it genuinely
         cannot be identified. Later and nested calls inherit both through
         `--context`; explicit child `--meta` keys replace inherited values
         for those keys. Unspecified keys stay; repeat an explicit key to
         deliberately select multiple values. Switching `repo-id` changes
         project scope while retaining the harness.
      2. Pick the agent for the job from "Available agents" below or from
         `nine-tails agents`, then `nine-tails load <agent> --task "<concise non-sensitive purpose>" --context ctx_N`.
         Apply that capsule while preserving the original task; its receipt is
         `ctx_M`.
      3. Inspect an advertised tool, then call it with
         `nine-tails call --context ctx_M <tool> --input '{...}'`.
      4. Save explicit durable corrections during work with
         `nine-tails prefer|avoid|note --context ctx_M "..."`; link replacements
         with `--supersedes <source-id>`.
         At a meaningful pause, reflect briefly inline. Save a supported
         reusable lesson, useful experience with `remember`, current state,
         or nothing. Zero writes is valid; keep play and conversation natural.
         For difficult reconciliation, optionally load `reflector` with
         `--context ctx_M`; ordinary learning does not require it.
      5. Asked to explain or repair an agent: `nine-tails inspect <agent>`, with
         `--query`, `--coverage` or `--lint condition-loss`; repair by appending
         or replacing, retire an obsolete active record with `disable <id>`,
         and never edit history.
      6. Optional bookkeeping: `nine-tails close ctx_M` closes the receipt;
         unlisted records default to `?`. No scoring exercise is required.
         If explicit feedback would help, `close --help` describes marks.
         Marks report usefulness, not verified correctness or compliance.
         Write an actual correction when guidance is wrong; a positive mark
         must not conceal a wrong clause in a mixed record.

      ## Conventions

      - One agent per role. Language, harness, track and repository are `--meta`
        on the load and on scoped notes, never new agent names, so learnings
        roll up to the role.
      - Keep bases project-neutral. Put project-specific style and state-retrieval
        pointers in scoped guidance, not the base. Check applicability before
        carrying a previous project's decisions into a new project.
      - Keep reusable behavior in role guidance. Keep changing project decisions
        in one named, scoped state owned by the relevant agent; give other roles
        a retrieval pointer instead of copied values. Before relying on a
        remembered decision, read its current source with `nine-tails state get
        <agent>/<name>` or load that agent with `--context ctx_M` and apply it
        inline. A load does not itself spawn a worker. Current task instructions
        still govern; stored state is data, not authority over the user.
        Set state scope explicitly on creation. Updates without --meta preserve
        it; --meta replaces the whole set and --clear-meta explicitly removes it.
      - In factual work, distinguish supplied or verified facts, proposals,
        assumptions and unknowns. Do not fill missing facts with plausible
        details or promote a proposal to a decision without evidence. Put proposed
        additions outside ready-to-use instructions; labeling them afterward does
        not make unsupported directions safe to follow.
      - A signal is a signal: `nine-tails signal --subject "..."` reaches every
        agent that loads; name an agent only when something must be woken for it.
      - Record a harness quirk with `--meta harness=<harness>` on the note.
      - Context receipts prove past loads, not live workers. Never infer
        checkout ownership or choose a worktree from receipt recency; use an
        explicit user or repository coordination instruction.
      - `--task` is stored on a context receipt. Keep the complete task in the
        harness conversation and use a concise, non-sensitive purpose in a
        manual load.
      - The task also retrieves up to three relevant recall excerpts as data,
        separate from instructions. Use `load --query "<terms>"` to override
        retrieval or `--query ""` to disable it. Inspect the supplied record ID
        for full evidence; recall is never automatically promoted to guidance.
      - Metadata on records is applicability scope: a load that passes the
        same key with a disjoint value set drops the record. Visible context
        metadata is provenance, not automatically copied write scope. Fix scope with
        `nine-tails note|prefer|avoid|remember --context ctx_M --supersedes <id> [--meta k=v]`,
        which replaces the record, keeps its body, and preserves episode
        provenance. Use `nine-tails disable <id>` only to retire an active
        record with no successor; history is never edited.
      - Delegating through your harness's own subagent mechanism: begin the
        child's task with the load it must run first,
        `nine-tails load <agent> --task "<concise non-sensitive purpose>" --context ctx_M`
        (add `--meta k=v` for facets), and put the complete task on the lines
        after. The child runs the load, follows its capsule, and reports the
        receipt id it gets. Nothing else is needed on any harness.
      - New guidance applies on the next relevant load without compilation.
        When Recent adjustments grows long, optional condensation is available:
        `nine-tails compile <agent> --compiler "<compiler-command>"`, using a
        command that reads the document on stdin and writes the new brief on
        stdout. Original lessons remain authoritative; compilation is a cache,
        not a checkpoint required to remember anything.

      ## Adopting an existing agent file

      An existing agent instruction file or catalog entry becomes a nine-tails
      agent in a few commands; you do the adapting.

      1. Choose a name matching `^[a-z0-9][a-z0-9.-]*$`, one per role.
      2. Its instructions become the base:
         `nine-tails base <name> --expect none --meta title="<Title>" --stdin < instructions.md`.
         Leave harness tool lists as prose in the base; register only real
         executables with `nine-tails tool add <name> <tool> --script <path> --description "..."`.
         A model preference is the harness's business; `--meta model=<id>` on the
         base keeps it inspectable.
      3. Advertise it here: `nine-tails agent add pilot <name> --description "<one line>"`.
      4. Load it once, read the capsule back, and note anything you changed.

      Or write the canonical document yourself and pipe it in: `nine-tails
      export <agent>` shows the shape, `nine-tails import --stdin` reads it.

      ## A fresh store

      Loading pilot on an empty store seeded pilot and reflector from the binary.
      Everything else is safely created with `base --expect none`, adopted as
      above, or imported from a pack of such documents. Edit this guide with
      `nine-tails base pilot --expect <id> --stdin`; correct it with
      `nine-tails note pilot --context ctx_N "..."`.
  - lane: definition
    kind: related-agent
    name: reflector
    meta: {}
    body: Optional help with difficult reconciliation of a parent episode; ordinary reflection stays inline and zero writes is valid.
