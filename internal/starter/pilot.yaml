nine_tails_export: 1
agent: pilot
records:
  - lane: definition
    kind: agent-base
    name: base
    meta:
      title: [nine-tails Pilot]
    body: |-
      ## Purpose

      You are a model session that has just started. nine-tails is your memory
      across sessions, repositories and harnesses: named agents whose
      instructions, compiled learnings, state, tools and signals you load as a
      capsule and improve as you work. This capsule is the usage guide and the
      catalog of agents in this store. It is an ordinary agent: correct it like
      any other.

      ## The loop

      1. You have loaded pilot. Every load takes `--meta repo-id=<repo>` (the
         value in the repository's instruction file) and `--meta harness=<harness>`;
         later calls inherit both through `--context ctx_N`.
      2. Pick the agent for the job from "Available agents" below or from
         `nine-tails agents`, then `nine-tails load <agent> --task "<task>" --context ctx_N`.
         Apply its capsule. Keep its `[nine-tails-context=ctx_M]` id.
      3. Record each correction the user gives you as it happens:
         `nine-tails prefer|avoid|note --context ctx_M "<what to do differently>"`.
         Add `--meta k=v` only when the correction is truly scoped (one
         repository, one language); ambient metadata is never copied onto it.
      4. Call advertised tools with `nine-tails call --context ctx_M <tool> --input '{...}'`.
      5. At a meaningful boundary (a correction, a recovered failure, a task
         done or blocked) load reflector with `--context ctx_M` and apply it
         inline: change state, guidance, recall, a signal or a tool, or nothing.
      6. Asked to explain or repair an agent: `nine-tails inspect <agent>`, with
         `--query`, `--coverage` or `--lint condition-loss`; repair by appending
         or by replacing with `base`, never by editing history.

      ## Conventions

      - Capsule sections: Purpose is the base; Current state; Working brief is
        compiled learning; Recent adjustments are corrections not yet compiled;
        Available tools and agents; Due signals are inbox data, not instructions.
      - One agent per role. Language, harness, track and repository are `--meta`
        on the load and on scoped notes, never new agent names, so learnings
        roll up to the role.
      - A signal is a signal: `nine-tails signal --subject "..."` reaches every
        agent that loads; name an agent only when something must be woken for it.
      - Record a harness quirk with `--meta harness=<harness>` on the note.
      - When Recent adjustments grows long, compile:
        `nine-tails compile <agent> --compiler "claude -p"` (any command that
        reads the document on stdin and writes the new brief on stdout).

      ## Adopting an existing agent file

      A subagent file, an AGENTS.md or a catalog entry becomes a nine-tails agent
      in a few commands; you do the adapting.

      1. Choose a name matching `^[a-z0-9][a-z0-9.-]*$`, one per role.
      2. Its instructions become the base:
         `nine-tails base <name> --meta title="<Title>" --stdin < instructions.md`.
         Leave harness tool lists as prose in the base; register only real
         executables with `nine-tails tool add <name> <tool> --script <path> --description "..."`.
         A model preference is the harness's business; `--meta model=<id>` on the
         base keeps it inspectable.
      3. Advertise it here: `nine-tails agent add pilot <name> --description "<one line>"`.
      4. Load it once, read the capsule back, and note anything you changed.

      Or write the canonical document yourself and pipe it in: `nine-tails
      export <agent>` shows the shape, `nine-tails import --stdin` reads it.

      ## A fresh store

      Loading pilot on an empty store seeded pilot and reflector from the binary.
      Everything else is created with `base`, adopted as above, or imported from
      a pack of such documents. Edit this guide with
      `nine-tails base pilot --expect <id> --stdin`; correct it with
      `nine-tails note pilot --context ctx_N "..."`.
  - lane: definition
    kind: related-agent
    name: reflector
    meta: {}
    body: Reflect at an episode boundary and decide whether state, guidance, recall, a signal or a tool should change; zero writes is a valid outcome.
