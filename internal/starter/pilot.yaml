nine_tails_export: 1
agent: pilot
records:
  - lane: definition
    kind: agent-base
    name: base
    meta:
      title: [nine-tails Pilot]
    body: |-
      ## Purpose

      nine-tails is durable memory across sessions, repositories, and execution
      environments: named agents whose instructions, compiled learning, state,
      tools, and signals arrive in a capsule and improve as you work. This
      pilot is the usage guide and agent catalog. It is an ordinary agent, so
      correct it through its own paired receipt like any other.

      ## The loop

      1. On the first load in a session, pass `--meta repo-id=<repo>` from the
         repository instruction file and `--meta harness=<harness>` whenever
         the harness is known. Use `harness=unknown` only when it genuinely
         cannot be identified. Later and nested calls inherit both through
         `--context`; add only new facets.
      2. Pick the agent for the job from "Available agents" below or from
         `nine-tails agents`, then `nine-tails load <agent> --task "<concise non-sensitive purpose>" --context ctx_N`.
         Apply that capsule while preserving the original task; its receipt is
         `ctx_M`.
      3. Inspect an advertised tool, then call it with
         `nine-tails call --context ctx_M <tool> --input '{...}'`.
      4. At a meaningful boundary (a correction, a recovered failure, a task
         done or blocked) load reflector with `--context ctx_M` and apply it
         inline: change state, guidance, recall, a signal, a reviewed reusable
         executable tool, or nothing.
      5. Asked to explain or repair an agent: `nine-tails inspect <agent>`, with
         `--query`, `--coverage` or `--lint condition-loss`; repair by appending
         or replacing, retire an obsolete active record with `disable <id>`,
         and never edit history.

      ## Conventions

      - One agent per role. Language, harness, track and repository are `--meta`
        on the load and on scoped notes, never new agent names, so learnings
        roll up to the role.
      - A signal is a signal: `nine-tails signal --subject "..."` reaches every
        agent that loads; name an agent only when something must be woken for it.
      - Record a harness quirk with `--meta harness=<harness>` on the note.
      - Context receipts prove past loads, not live workers. Never infer
        checkout ownership or choose a worktree from receipt recency; use an
        explicit user or repository coordination instruction.
      - `--task` is stored on a context receipt. Keep the complete task in the
        harness conversation and use a concise, non-sensitive purpose in a
        manual load.
      - Metadata is applicability scope, never provenance: a load that passes
         the same key with another value drops the record. Where a record came
         from is its origin context. Fix a wrong scope with
        `nine-tails note|prefer|avoid|remember --context ctx_M --supersedes <id> [--meta k=v]`,
        which replaces the record, keeps its body, and preserves episode
        provenance. Use `nine-tails disable <id>` only to retire an active
        record with no successor; history is never edited.
      - Delegating through your harness's own subagent mechanism: begin the
        child's task with the load it must run first,
        `nine-tails load <agent> --task "<concise non-sensitive purpose>" --context ctx_M`
        (add `--meta k=v` for facets), and put the complete task on the lines
        after. The child runs the load, follows its capsule, and reports the
        receipt id it gets. Nothing else is needed on any harness.
      - When Recent adjustments grows long, or load says so on stderr, compile:
        `nine-tails compile <agent> --compiler "<compiler-command>"`, using a
        command that reads the document on stdin and writes the new brief on
        stdout.

      ## Adopting an existing agent file

      An existing agent instruction file or catalog entry becomes a nine-tails
      agent in a few commands; you do the adapting.

      1. Choose a name matching `^[a-z0-9][a-z0-9.-]*$`, one per role.
      2. Its instructions become the base:
         `nine-tails base <name> --expect none --meta title="<Title>" --stdin < instructions.md`.
         Leave harness tool lists as prose in the base; register only real
         executables with `nine-tails tool add <name> <tool> --script <path> --description "..."`.
         A model preference is the harness's business; `--meta model=<id>` on the
         base keeps it inspectable.
      3. Advertise it here: `nine-tails agent add pilot <name> --description "<one line>"`.
      4. Load it once, read the capsule back, and note anything you changed.

      Or write the canonical document yourself and pipe it in: `nine-tails
      export <agent>` shows the shape, `nine-tails import --stdin` reads it.

      ## A fresh store

      Loading pilot on an empty store seeded pilot and reflector from the binary.
      Everything else is safely created with `base --expect none`, adopted as
      above, or imported from a pack of such documents. Edit this guide with
      `nine-tails base pilot --expect <id> --stdin`; correct it with
      `nine-tails note pilot --context ctx_N "..."`.
  - lane: definition
    kind: related-agent
    name: reflector
    meta: {}
    body: Reflect on a parent episode and decide whether state, guidance, recall, a signal, or a reviewed reusable tool should change; zero writes is a valid outcome.
